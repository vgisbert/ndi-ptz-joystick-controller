<!DOCTYPE html>
<html class="dark" lang="es">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title data-i18n="app_title">Controlador PTZ NDI</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400..800&family=Space+Grotesk:wght@500..700&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; background: #111319; overscroll-behavior: none; user-select: none; -webkit-user-select: none; overflow: hidden; }
    ::-webkit-scrollbar { display: none; }
  </style>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface-dim": "#111319",
            "surface-lowest": "#0b0e13",
            "surface-low": "#191c21",
            "surface": "#1d2025",
            "surface-high": "#272a30",
            "surface-highest": "#32353a",
            "cyan-tac": "#00f0ff",
            "cyan-dim": "#006970",
            "amber-tac": "#feb300",
            "amber-dim": "#4d3400",
            "red-tac": "#ff1744",
            "red-dim": "#93000a",
            "txt-main": "#e1e2e9",
            "txt-muted": "#849495",
            "border-tac": "#3b494b"
          },
          fontFamily: {
            "sans": ["Space Grotesk", "sans-serif"],
            "mono": ["JetBrains Mono", "monospace"]
          }
        }
      }
    };
  </script>
</head>
<body class="bg-surface-dim text-txt-main font-mono text-[11px] antialiased flex flex-col justify-start p-1.5 gap-1">

  <!-- ================= OVERLAY MODO DESCONECTADO (ESCALA DE GRISES) ================= -->
  <div id="offline-overlay" class="hidden fixed inset-0 z-40 bg-black/65 backdrop-blur-[2px] flex flex-col items-center justify-center gap-1.5 p-3 text-center">
    <div class="px-2.5 py-1 rounded bg-red-dim border border-red-tac text-white font-bold text-[11px] tracking-wider flex items-center gap-1 shadow-lg">
      <span class="material-symbols-outlined text-[15px] animate-pulse">wifi_off</span>
      <span data-i18n="offline_no_signal">SIN SEÑAL DE CÁMARA</span>
    </div>
    <span id="offline-subtext" class="text-[10px] text-txt-muted" data-i18n="offline_subtext">Buscando cámaras Nuroum V403 en UDP 1259...</span>
    <div class="flex items-center gap-1.5 mt-0.5">
      <button id="btn-offline-scan" class="px-2.5 py-1 rounded bg-cyan-tac text-surface-lowest font-bold text-[10px] uppercase hover:opacity-90 flex items-center gap-1">
        <span class="material-symbols-outlined text-[13px]">travel_explore</span>
        <span data-i18n="offline_btn_scan">BUSCAR AHORA</span>
      </button>
      <a href="settings.html" class="px-2.5 py-1 rounded bg-surface-high border border-border-tac text-txt-main font-bold text-[10px] uppercase hover:bg-surface-highest" data-i18n="offline_btn_settings">
        AJUSTES
      </a>
    </div>
  </div>

  <!-- ================= 1. BARRA SUPERIOR COMPACTA (BOTONES CAM DINÁMICOS + IDIOMA + PIN + AJUSTES) ================= -->
  <header class="flex items-center justify-between bg-surface-low px-1.5 py-1 rounded border border-border-tac/40 shrink-0">
    <div id="cam-tabs-container" class="flex items-center gap-1 overflow-x-auto max-w-[165px]">
      <span class="px-1.5 py-0.5 rounded bg-surface-high text-txt-muted font-bold text-[9px]" data-i18n="tabs_searching">BUSCANDO...</span>
    </div>

    <div class="flex items-center gap-1">
      <div class="px-1.5 py-0.5 rounded bg-surface-lowest border border-border-tac/30 flex items-center gap-1 text-[10px]">
        <span id="card-status-dot" class="w-1.5 h-1.5 rounded-full bg-cyan-tac shadow-[0_0_5px_#00f0ff]"></span>
        <span id="card-header-ip" class="text-txt-main">192.168.1.101</span>
        <span id="card-header-rtt" class="text-cyan-tac font-bold">4ms</span>
      </div>

      <!-- BOTÓN DE IDIOMA COMPACTO (SP / EN / ...) -->
      <button id="btn-lang" class="px-1.5 py-0.5 rounded bg-surface-high hover:bg-surface-highest text-cyan-tac font-bold text-[10px] border border-border-tac/40 transition-colors cursor-pointer" data-i18n-title="btn_lang_title" title="Cambiar idioma">
        SP
      </button>

      <button id="btn-pin-main" class="w-5 h-5 rounded bg-surface-high hover:bg-surface-highest flex items-center justify-center text-txt-muted hover:text-txt-main transition-colors" data-i18n-title="btn_pin_title" title="Fijar ventana siempre visible">
        <span class="material-symbols-outlined text-[13px]">push_pin</span>
      </button>
      <a href="settings.html" class="w-5 h-5 rounded bg-surface-high hover:bg-surface-highest flex items-center justify-center text-txt-muted hover:text-txt-main transition-colors" data-i18n-title="btn_settings_title" title="Configuración">
        <span class="material-symbols-outlined text-[13px]">settings</span>
      </a>
    </div>
  </header>

  <!-- ================= 2. TIRA DE TELEMETRÍA AJUSTADA AL TEXTO ================= -->
  <section class="bg-surface-lowest px-2 py-1 rounded border border-border-tac/40 shadow-inner flex items-center justify-between gap-1 shrink-0">
    <div class="flex items-center gap-1">
      <div class="px-1.5 py-0.5 rounded bg-surface-low border border-border-tac/25 flex items-center gap-1">
        <span class="text-[9px] text-txt-muted" data-i18n="telem_pan">GIRO</span>
        <span id="oled-pan" class="text-cyan-tac font-bold text-[11px] tabular-nums">+0.0°</span>
      </div>
      <div class="px-1.5 py-0.5 rounded bg-surface-low border border-border-tac/25 flex items-center gap-1">
        <span class="text-[9px] text-txt-muted" data-i18n="telem_tilt">INCL.</span>
        <span id="oled-tilt" class="text-cyan-tac font-bold text-[11px] tabular-nums">+0.0°</span>
      </div>
      <div class="px-1.5 py-0.5 rounded bg-surface-low border border-border-tac/25 flex items-center gap-1">
        <span class="text-[9px] text-txt-muted" data-i18n="telem_zoom">ZOOM</span>
        <span id="oled-zoom" class="text-amber-tac font-bold text-[11px] tabular-nums">1.0x</span>
      </div>
    </div>

    <span id="oled-preset-badge" class="px-1.5 py-0.5 rounded bg-amber-tac/20 border border-amber-tac/40 text-amber-tac font-bold text-[10px] tracking-wide whitespace-nowrap" data-i18n="badge_center">
      CENTRO
    </span>
  </section>

  <!-- ================= 3. BLOQUE CENTRAL CUADRADO: JOYSTICK + ZOOM/CENTRO ================= -->
  <section id="camera-card" class="flex items-stretch gap-1.5 shrink-0">

    <!-- Cuadro Cuadrado del Joystick (144x144px) -->
    <div class="bg-surface p-1.5 rounded border border-border-tac/30 flex items-center justify-center shrink-0">
      <div id="joystick-ring" class="relative w-32 h-32 rounded-full bg-surface-lowest flex items-center justify-center shadow-[inset_0_4px_10px_rgba(0,0,0,0.9)] touch-none cursor-crosshair shrink-0">
        <svg class="absolute inset-0 w-full h-full pointer-events-none text-border-tac/50" fill="none" viewBox="0 0 200 200">
          <circle cx="100" cy="100" r="88" stroke="currentColor" stroke-dasharray="2 3" stroke-width="1"></circle>
          <circle cx="100" cy="100" r="52" stroke="currentColor" stroke-dasharray="3 3" stroke-width="1"></circle>
          <line stroke="currentColor" stroke-width="1" x1="100" x2="100" y1="8" y2="192"></line>
          <line stroke="currentColor" stroke-width="1" x1="8" x2="192" y1="100" y2="100"></line>
        </svg>

        <!-- Flechas de Dirección -->
        <button id="btn-dir-up" class="z-20 absolute top-0.5 left-1/2 -translate-x-1/2 w-7 h-4 rounded bg-surface-high hover:bg-surface-highest active:bg-cyan-tac active:text-surface-lowest flex items-center justify-center border border-border-tac/40" data-i18n-title="btn_dir_up_title" title="Inclinar arriba (Flecha Arriba)">
          <span class="material-symbols-outlined text-[15px]">arrow_drop_up</span>
        </button>
        <button id="btn-dir-down" class="z-20 absolute bottom-0.5 left-1/2 -translate-x-1/2 w-7 h-4 rounded bg-surface-high hover:bg-surface-highest active:bg-cyan-tac active:text-surface-lowest flex items-center justify-center border border-border-tac/40" data-i18n-title="btn_dir_down_title" title="Inclinar abajo (Flecha Abajo)">
          <span class="material-symbols-outlined text-[15px]">arrow_drop_down</span>
        </button>
        <button id="btn-dir-left" class="z-20 absolute left-0.5 top-1/2 -translate-y-1/2 w-4 h-7 rounded bg-surface-high hover:bg-surface-highest active:bg-cyan-tac active:text-surface-lowest flex items-center justify-center border border-border-tac/40" data-i18n-title="btn_dir_left_title" title="Girar a la izquierda (Flecha Izquierda)">
          <span class="material-symbols-outlined text-[15px]">arrow_left</span>
        </button>
        <button id="btn-dir-right" class="z-20 absolute right-0.5 top-1/2 -translate-y-1/2 w-4 h-7 rounded bg-surface-high hover:bg-surface-highest active:bg-cyan-tac active:text-surface-lowest flex items-center justify-center border border-border-tac/40" data-i18n-title="btn_dir_right_title" title="Girar a la derecha (Flecha Derecha)">
          <span class="material-symbols-outlined text-[15px]">arrow_right</span>
        </button>

        <!-- Puntero del Joystick -->
        <div id="joystick-handle" class="z-10 w-9 h-9 rounded-full bg-surface-highest border-2 border-cyan-tac shadow-[0_0_10px_rgba(0,240,255,0.5)] flex items-center justify-center pointer-events-none transition-transform duration-75">
          <span class="w-2.5 h-2.5 rounded-full bg-cyan-tac shadow-[0_0_5px_#00f0ff]"></span>
        </div>
      </div>
    </div>

    <!-- Columna Derecha: ZOOM + CENTRO + Espejo -->
    <div class="flex-1 bg-surface p-1.5 rounded border border-border-tac/30 flex flex-col justify-between gap-1">
      <div class="flex items-center justify-between text-[9px] text-txt-muted">
        <button id="btn-mirror-pan" class="px-1.5 py-0.5 rounded bg-surface-high hover:bg-surface-highest text-txt-muted hover:text-txt-main font-bold text-[9px] flex items-center gap-0.5 border border-border-tac/40 transition-colors" data-i18n-title="btn_mirror_title" title="Invertir sentido Derecha/Izquierda del Joystick y flechas para coincidir con Espejo en OBS">
          <span class="material-symbols-outlined text-[12px]">swap_horiz</span>
          <span data-i18n="btn_mirror">ESPEJO ↔</span>
        </button>
        <span id="joystick-deflection" class="text-cyan-tac font-bold tabular-nums">X:0% Y:0%</span>
      </div>

      <!-- Botones de Zoom Óptico -->
      <div class="grid grid-cols-2 gap-1.5 flex-1">
        <button id="btn-zoom-tele" class="rounded bg-surface-high hover:bg-surface-highest active:bg-cyan-tac active:text-surface-lowest font-bold text-[10px] flex flex-col items-center justify-center border border-border-tac/40 touch-none" data-i18n-title="btn_zoom_in_title" title="Acercar imagen">
          <span class="material-symbols-outlined text-[18px] text-cyan-tac">zoom_in</span>
          <span data-i18n="btn_zoom_in">ACERCAR +</span>
        </button>
        <button id="btn-zoom-wide" class="rounded bg-surface-high hover:bg-surface-highest active:bg-cyan-tac active:text-surface-lowest font-bold text-[10px] flex flex-col items-center justify-center border border-border-tac/40 touch-none" data-i18n-title="btn_zoom_out_title" title="Alejar imagen">
          <span class="material-symbols-outlined text-[18px] text-amber-tac">zoom_out</span>
          <span data-i18n="btn_zoom_out">ALEJAR -</span>
        </button>
      </div>

      <!-- Botón Centrar Cámara -->
      <button id="btn-home-center" class="w-full py-1.5 rounded bg-surface-high hover:bg-surface-highest active:bg-cyan-tac active:text-surface-lowest font-bold text-[10px] flex items-center justify-center gap-1 border border-border-tac/40 transition-colors" data-i18n-title="btn_home_center_title" title="Centrar cámara (Barra Espaciadora)">
        <span class="material-symbols-outlined text-[14px] text-amber-tac">filter_center_focus</span>
        <span data-i18n="btn_home_center">CENTRAR [ESPACIO]</span>
      </button>
    </div>

  </section>

  <!-- ================= 4. BANCADA COMPACTA DE PUNTOS DE PARADA (1-8) ================= -->
  <section class="bg-surface p-1.5 rounded border border-border-tac/30 flex flex-col gap-1 shrink-0">
    <div class="flex items-center justify-between text-[9px] px-0.5">
      <span class="text-amber-tac font-bold uppercase" data-i18n="presets_goto_title">IR A PUNTO (1-8)</span>
      <span id="mem-feedback-label" class="text-txt-muted" data-i18n="mem_help_label">GUARDAR: MANTENER 2s</span>
    </div>

    <!-- Cuadrícula 4x2 ajustada al texto -->
    <div class="grid grid-cols-4 gap-1">
      <button data-goto="1" data-label="ESCEN." class="btn-goto py-1 px-1 rounded bg-surface-high hover:bg-surface-highest text-txt-main font-bold text-[10px] flex items-center justify-center gap-1 border border-border-tac/30 active:scale-95 transition-all touch-none select-none">
        <span class="text-txt-muted text-[9px]">1</span><span>ESCEN.</span>
      </button>
      <button data-goto="2" data-label="TECLADO" class="btn-goto py-1 px-1 rounded bg-surface-high hover:bg-surface-highest text-txt-main font-bold text-[10px] flex items-center justify-center gap-1 border border-border-tac/30 active:scale-95 transition-all touch-none select-none">
        <span class="text-txt-muted text-[9px]">2</span><span>TECLADO</span>
      </button>
      <button data-goto="3" data-label="BATERÍA" class="btn-goto py-1 px-1 rounded bg-surface-high hover:bg-surface-highest text-txt-main font-bold text-[10px] flex items-center justify-center gap-1 border border-border-tac/30 active:scale-95 transition-all touch-none select-none">
        <span class="text-txt-muted text-[9px]">3</span><span>BATERÍA</span>
      </button>
      <button data-goto="4" data-label="VOZ" class="btn-goto py-1 px-1 rounded bg-surface-high hover:bg-surface-highest text-txt-main font-bold text-[10px] flex items-center justify-center gap-1 border border-border-tac/30 active:scale-95 transition-all touch-none select-none">
        <span class="text-txt-muted text-[9px]">4</span><span>VOZ</span>
      </button>
      <button data-goto="5" data-label="BAJO" class="btn-goto py-1 px-1 rounded bg-surface-high hover:bg-surface-highest text-txt-main font-bold text-[10px] flex items-center justify-center gap-1 border border-border-tac/30 active:scale-95 transition-all touch-none select-none">
        <span class="text-txt-muted text-[9px]">5</span><span>BAJO</span>
      </button>
      <button data-goto="6" data-label="GUIT." class="btn-goto py-1 px-1 rounded bg-surface-high hover:bg-surface-highest text-txt-main font-bold text-[10px] flex items-center justify-center gap-1 border border-border-tac/30 active:scale-95 transition-all touch-none select-none">
        <span class="text-txt-muted text-[9px]">6</span><span>GUIT.</span>
      </button>
      <button data-goto="7" data-label="PÚBLICO" class="btn-goto py-1 px-1 rounded bg-surface-high hover:bg-surface-highest text-txt-main font-bold text-[10px] flex items-center justify-center gap-1 border border-border-tac/30 active:scale-95 transition-all touch-none select-none">
        <span class="text-txt-muted text-[9px]">7</span><span>PÚBLICO</span>
      </button>
      <button data-goto="8" data-label="TELÓN" class="btn-goto py-1 px-1 rounded bg-surface-high hover:bg-surface-highest text-txt-main font-bold text-[10px] flex items-center justify-center gap-1 border border-border-tac/30 active:scale-95 transition-all touch-none select-none">
        <span class="text-txt-muted text-[9px]">8</span><span>TELÓN</span>
      </button>
    </div>
  </section>

  <script src="i18n.js"></script>
  <script src="ndi_ptz_client.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.NDIPtz && window.NDIPtz.setWindowSize) {
        window.NDIPtz.setWindowSize(360, 312);
      }
      let activeCameraId = localStorage.getItem('ndi_active_cam') || '';
      if (activeCameraId === 'undefined' || activeCameraId === 'null') { activeCameraId = ''; }

      function getActiveCameraId() {
        if (activeCameraId && activeCameraId !== 'undefined' && activeCameraId !== 'null') {
          return activeCameraId;
        }
        if (onlineCameras.length > 0) {
          return onlineCameras[0].id;
        }
        return '';
      }
      let onlineCameras = [];
      let camerasMap = {};

      let isDraggingJoystick = false;
      let lastVectorSentAt = 0;
      let isPinned = false;
      let isMirrorBtnActive = false;
      const pressedArrows = new Set();

      const camTabsContainer = document.getElementById('cam-tabs-container');
      const cameraCard = document.getElementById('camera-card');
      const offlineOverlay = document.getElementById('offline-overlay');
      const offlineSubtext = document.getElementById('offline-subtext');
      const btnOfflineScan = document.getElementById('btn-offline-scan');

      const cardStatusDot = document.getElementById('card-status-dot');
      const cardHeaderIp = document.getElementById('card-header-ip');
      const cardHeaderRtt = document.getElementById('card-header-rtt');

      const oledPresetBadge = document.getElementById('oled-preset-badge');
      const oledPan = document.getElementById('oled-pan');
      const oledTilt = document.getElementById('oled-tilt');
      const oledZoom = document.getElementById('oled-zoom');

      const joystickRing = document.getElementById('joystick-ring');
      const joystickHandle = document.getElementById('joystick-handle');
      const joystickDeflection = document.getElementById('joystick-deflection');
      const btnHomeCenter = document.getElementById('btn-home-center');

      const btnDirUp = document.getElementById('btn-dir-up');
      const btnDirDown = document.getElementById('btn-dir-down');
      const btnDirLeft = document.getElementById('btn-dir-left');
      const btnDirRight = document.getElementById('btn-dir-right');

      const btnZoomTele = document.getElementById('btn-zoom-tele');
      const btnZoomWide = document.getElementById('btn-zoom-wide');
      const btnMirrorPan = document.getElementById('btn-mirror-pan');
      const memFeedbackLabel = document.getElementById('mem-feedback-label');

      function updateMirrorPanUi() {
        if (isMirrorBtnActive) {
          btnMirrorPan.className = 'px-1.5 py-0.5 rounded bg-amber-tac text-surface-lowest font-bold text-[9px] flex items-center gap-0.5 shadow-[0_0_6px_rgba(254,179,0,0.5)] transition-colors';
        } else {
          btnMirrorPan.className = 'px-1.5 py-0.5 rounded bg-surface-high hover:bg-surface-highest text-txt-muted hover:text-txt-main font-bold text-[9px] flex items-center gap-0.5 border border-border-tac/40 transition-colors';
        }
      }

      btnMirrorPan.addEventListener('click', () => {
        btnMirrorPan.blur();
        isMirrorBtnActive = !isMirrorBtnActive;
        localStorage.setItem(`ndi_mirror_std_${activeCameraId}`, isMirrorBtnActive ? '1' : '0');
        updateMirrorPanUi();
      });

      // ================= JOYSTICK CUADRADO COMPACTO =================
      const maxRadius = 42;

      function setHandleVisual(dx, dy, normX, normY) {
        joystickHandle.style.transform = `translate(${dx.toFixed(1)}px, ${dy.toFixed(1)}px)`;
        const pctX = Math.round(normX * 100);
        const pctY = Math.round(normY * 100);
        joystickDeflection.textContent = `X:${pctX}% Y:${pctY}%`;
      }

      function processJoystickPointer(clientX, clientY, forceSend = false) {
        const rect = joystickRing.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;

        let dx = clientX - centerX;
        let dy = clientY - centerY;

        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist > maxRadius) {
          dx = (dx / dist) * maxRadius;
          dy = (dy / dist) * maxRadius;
        }

        const normX = dx / maxRadius;
        const normY = -(dy / maxRadius);

        setHandleVisual(dx, dy, normX, normY);

        const now = performance.now();
        if (forceSend || now - lastVectorSentAt >= 45) {
          lastVectorSentAt = now;
          oledPresetBadge.textContent = window.I18n.t('badge_manual');
          clearActivePresetHighlight();
          const outX = isMirrorBtnActive ? normX : -normX;
          const targetCam = getActiveCameraId();
          if (targetCam) { window.NDIPtz.sendVector(targetCam, outX, normY, 1.0); }
        }
      }

      function stopJoystickAndCenter() {
        setHandleVisual(0, 0, 0, 0);
        const targetCam = getActiveCameraId();
        if (targetCam) { window.NDIPtz.stop(targetCam); }
      }

      joystickRing.addEventListener('pointerdown', (e) => {
        if (e.target.closest('button')) return;
        isDraggingJoystick = true;
        joystickRing.setPointerCapture(e.pointerId);
        processJoystickPointer(e.clientX, e.clientY, true);
      });

      joystickRing.addEventListener('pointermove', (e) => {
        if (!isDraggingJoystick) return;
        processJoystickPointer(e.clientX, e.clientY, false);
      });

      const endJoystickDrag = () => {
        if (!isDraggingJoystick) return;
        isDraggingJoystick = false;
        stopJoystickAndCenter();
      };

      joystickRing.addEventListener('pointerup', endJoystickDrag);
      joystickRing.addEventListener('pointercancel', endJoystickDrag);

      // Botones de Flechas en Pantalla
      function bindDirectionalButton(btn, vecX, vecY) {
        let isPressed = false;
        const startMove = (e) => {
          e.stopPropagation();
          e.preventDefault();
          btn.blur();
          isPressed = true;
          setHandleVisual(vecX * (maxRadius * 0.7), -vecY * (maxRadius * 0.7), vecX, vecY);
          oledPresetBadge.textContent = window.I18n.t('badge_manual');
          clearActivePresetHighlight();
          const outX = isMirrorBtnActive ? vecX : -vecX;
          const targetCam = getActiveCameraId();
          if (targetCam) { window.NDIPtz.sendVector(targetCam, outX, vecY, 1.0); }
        };
        const stopMove = (e) => {
          e.stopPropagation();
          if (!isPressed) return;
          isPressed = false;
          stopJoystickAndCenter();
        };
        btn.addEventListener('pointerdown', startMove);
        btn.addEventListener('pointerup', stopMove);
        btn.addEventListener('pointerleave', stopMove);
        btn.addEventListener('pointercancel', stopMove);
      }

      bindDirectionalButton(btnDirUp, 0, 1);
      bindDirectionalButton(btnDirDown, 0, -1);
      bindDirectionalButton(btnDirLeft, -1, 0);
      bindDirectionalButton(btnDirRight, 1, 0);

      async function triggerHome() {
        if (document.activeElement && document.activeElement.blur) {
          document.activeElement.blur();
        }
        setHandleVisual(0, 0, 0, 0);
        clearActivePresetHighlight();
        oledPresetBadge.textContent = window.I18n.t('badge_center');
        const targetCam = getActiveCameraId();
        if (targetCam) { await window.NDIPtz.home(targetCam); }
      }

      btnHomeCenter.addEventListener('click', (e) => {
        if (e.detail === 0) return;
        btnHomeCenter.blur();
        triggerHome();
      });

      // Zoom
      function bindZoomButton(btn, dir) {
        let isPressed = false;
        const startZoom = (e) => {
          e.preventDefault();
          btn.blur();
          isPressed = true;
          const targetCam = getActiveCameraId();
          if (targetCam) { window.NDIPtz.zoom(targetCam, dir, 5); }
        };
        const stopZoom = () => {
          if (!isPressed) return;
          isPressed = false;
          const targetCam = getActiveCameraId();
          if (targetCam) { window.NDIPtz.zoom(targetCam, 'stop'); }
        };
        btn.addEventListener('pointerdown', startZoom);
        btn.addEventListener('pointerup', stopZoom);
        btn.addEventListener('pointerleave', stopZoom);
        btn.addEventListener('pointercancel', stopZoom);
      }

      bindZoomButton(btnZoomTele, 'tele');
      bindZoomButton(btnZoomWide, 'wide');

      // Puntos de Parada (1-8): Pulsación normal = IR A PUNTO | Mantener 2 segundos = MEMORIZAR
      const gotoButtons = document.querySelectorAll('.btn-goto');
      let currentActivePresetNum = null;

      const defaultGotoClass = 'btn-goto py-1 px-1 rounded bg-surface-high hover:bg-surface-highest text-txt-main font-bold text-[10px] flex items-center justify-center gap-1 border border-border-tac/30 active:scale-95 transition-all touch-none select-none';
      const activeGotoClass = 'btn-goto py-1 px-1 rounded bg-amber-tac text-surface-lowest font-bold text-[10px] flex items-center justify-center gap-1 shadow-[0_0_8px_rgba(254,179,0,0.6)] border border-amber-tac transition-all touch-none select-none';
      const holdingGotoClass = 'btn-goto py-1 px-1 rounded bg-red-dim text-white font-bold text-[10px] flex items-center justify-center gap-1 border border-red-tac animate-pulse transition-all touch-none select-none';
      const savedGotoClass = 'btn-goto py-1 px-1 rounded bg-cyan-tac text-surface-lowest font-bold text-[10px] flex items-center justify-center gap-1 border border-cyan-tac shadow-[0_0_10px_rgba(0,240,255,0.8)] transition-all touch-none select-none';

      function clearActivePresetHighlight() {
        currentActivePresetNum = null;
        gotoButtons.forEach((b) => {
          b.className = defaultGotoClass;
        });
      }

      function highlightActivePreset(num) {
        currentActivePresetNum = num;
        gotoButtons.forEach((b) => {
          const btnNum = parseInt(b.getAttribute('data-goto'), 10);
          b.className = (btnNum === num) ? activeGotoClass : defaultGotoClass;
        });
      }

      async function recallPreset(num) {
        highlightActivePreset(num);
        const targetBtn = document.querySelector(`.btn-goto[data-goto="${num}"]`);
        const label = targetBtn ? targetBtn.getAttribute('data-label') : `P${num}`;
        oledPresetBadge.textContent = `P${num} ${label}`;
        const targetCam = getActiveCameraId();
        if (targetCam) { await window.NDIPtz.preset(targetCam, 'recall', num); }
      }

      gotoButtons.forEach((btn) => {
        const num = parseInt(btn.getAttribute('data-goto'), 10);
        let holdTimer = null;
        let visualTimer = null;
        let isLongPress = false;

        const cancelHold = () => {
          if (visualTimer) {
            clearTimeout(visualTimer);
            visualTimer = null;
          }
          if (holdTimer) {
            clearTimeout(holdTimer);
            holdTimer = null;
          }
          if (btn.className.includes('bg-red-dim')) {
            btn.className = (currentActivePresetNum === num) ? activeGotoClass : defaultGotoClass;
          }
          if (memFeedbackLabel.textContent !== window.I18n.t('mem_saved_feedback', { n: num })) {
            memFeedbackLabel.textContent = window.I18n.t('mem_help_label');
            memFeedbackLabel.className = 'text-txt-muted';
          }
        };

        btn.addEventListener('pointerdown', (e) => {
          if (e.button !== 0) return; // Solo botón principal
          isLongPress = false;

          // Indicador visual tras 180ms para no parpadear en clics rápidos
          visualTimer = setTimeout(() => {
            btn.className = holdingGotoClass;
            memFeedbackLabel.textContent = window.I18n.t('mem_saving', { n: num });
            memFeedbackLabel.className = 'text-red-tac font-bold';
          }, 180);

          // Memorizar tras 2 segundos mantenido pulsado
          holdTimer = setTimeout(async () => {
            holdTimer = null;
            isLongPress = true;
            if (visualTimer) clearTimeout(visualTimer);

            const targetCam = getActiveCameraId();
            if (targetCam) { await window.NDIPtz.preset(targetCam, 'store', num); }
            currentActivePresetNum = num;

            btn.className = savedGotoClass;
            oledPresetBadge.textContent = window.I18n.t('mem_saved_badge', { n: num });
            memFeedbackLabel.textContent = window.I18n.t('mem_saved_feedback', { n: num });
            memFeedbackLabel.className = 'text-cyan-tac font-bold';

            setTimeout(() => {
              btn.className = (currentActivePresetNum === num) ? activeGotoClass : defaultGotoClass;
              memFeedbackLabel.textContent = window.I18n.t('mem_help_label');
              memFeedbackLabel.className = 'text-txt-muted';
            }, 1200);
          }, 2000);
        });

        btn.addEventListener('pointerup', () => {
          if (visualTimer) {
            clearTimeout(visualTimer);
            visualTimer = null;
          }
          if (holdTimer) {
            clearTimeout(holdTimer);
            holdTimer = null;
          }
          if (!isLongPress) {
            // Pulsación normal (< 2s): selección / ir a preset
            recallPreset(num);
          }
          if (memFeedbackLabel.textContent !== window.I18n.t('mem_saved_feedback', { n: num })) {
            memFeedbackLabel.textContent = window.I18n.t('mem_help_label');
            memFeedbackLabel.className = 'text-txt-muted';
          }
        });

        btn.addEventListener('pointerleave', cancelHold);
        btn.addEventListener('pointercancel', cancelHold);

        btn.addEventListener('click', (e) => {
          if (isLongPress) {
            e.preventDefault();
            e.stopPropagation();
            isLongPress = false;
          }
        });
      });

      // Flechas del Teclado y Atajos
      function updateKeyboardArrowsVector() {
        let vx = 0;
        let vy = 0;
        if (pressedArrows.has('ArrowLeft')) vx -= 1;
        if (pressedArrows.has('ArrowRight')) vx += 1;
        if (pressedArrows.has('ArrowUp')) vy += 1;
        if (pressedArrows.has('ArrowDown')) vy -= 1;

        if (vx === 0 && vy === 0) {
          stopJoystickAndCenter();
        } else {
          setHandleVisual(vx * (maxRadius * 0.7), -vy * (maxRadius * 0.7), vx, vy);
          oledPresetBadge.textContent = window.I18n.t('badge_manual');
          clearActivePresetHighlight();
          const outX = isMirrorBtnActive ? vx : -vx;
          window.NDIPtz.sendVector(activeCameraId, outX, vy, 1.0);
        }
      }

      window.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT') return;

        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
          e.preventDefault();
          if (e.repeat) return;
          pressedArrows.add(e.key);
          updateKeyboardArrowsVector();
        } else if (e.code === 'Space') {
          e.preventDefault();
          if (e.repeat) return;
          triggerHome();
        } else if (e.code === 'Enter') {
          e.preventDefault();
        } else if (e.key >= '1' && e.key <= '8') {
          if (e.repeat) return;
          recallPreset(parseInt(e.key, 10));
        }
      });

      window.addEventListener('keyup', (e) => {
        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
          e.preventDefault();
          if (pressedArrows.has(e.key)) {
            pressedArrows.delete(e.key);
            updateKeyboardArrowsVector();
          }
        }
      });

      window.addEventListener('blur', () => {
        if (pressedArrows.size > 0) {
          pressedArrows.clear();
          stopJoystickAndCenter();
        }
      });

      function loadProfiles() {
        try {
          const raw = localStorage.getItem('ndi_cam_profiles') || localStorage.getItem('ndi_cam_profiles_mac');
          return raw ? JSON.parse(raw) : {};
        } catch (e) {
          return {};
        }
      }

      function saveProfiles(profiles) {
        localStorage.setItem('ndi_cam_profiles', JSON.stringify(profiles));
      }

      function ensureCameraProfile(cam, index) {
        const profiles = loadProfiles();
        const camKey = cam.id;
        const currentDefaults = window.I18n.getDefaultPresets();
        const defaultCamName = `${window.I18n.t('cam_prefix')} ${index + 1}`;

        if (!profiles[camKey]) {
          profiles[camKey] = {
            id: cam.id,
            mac: cam.mac || '',
            customName: '',
            lastIp: cam.ip,
            port: cam.visca_port || 1259,
            presets: [...currentDefaults]
          };
        } else {
          profiles[camKey].mac = cam.mac || profiles[camKey].mac || '';
          profiles[camKey].lastIp = cam.ip || profiles[camKey].lastIp;
          if (!Array.isArray(profiles[camKey].presets) || profiles[camKey].presets.length < 8) {
            profiles[camKey].presets = [...currentDefaults];
          }
        }
        saveProfiles(profiles);
        const prof = profiles[camKey];
        const displayName = (prof.customName && prof.customName.trim()) ? prof.customName.trim() : defaultCamName;
        return { ...prof, displayName };
      }

      function applyCustomPresets(camId) {
        const profiles = loadProfiles();
        const p = profiles[camId];
        const defaultPresets = window.I18n.getDefaultPresets();
        const presets = (p && Array.isArray(p.presets)) ? p.presets : defaultPresets;
        gotoButtons.forEach((btn, idx) => {
          const name = presets[idx] || defaultPresets[idx] || `P${idx + 1}`;
          btn.setAttribute('data-label', name);
          const spans = btn.querySelectorAll('span');
          if (spans.length >= 2) spans[1].textContent = name;
        });
      }

      function renderDynamicCameraTabs() {
        camTabsContainer.innerHTML = '';

        if (onlineCameras.length === 0) {
          const badge = document.createElement('span');
          badge.className = 'px-1.5 py-0.5 rounded bg-surface-high text-red-tac font-bold text-[9px]';
          badge.textContent = window.I18n.t('tabs_no_cameras');
          camTabsContainer.appendChild(badge);

          cardHeaderIp.textContent = window.I18n.t('status_no_network');
          cardHeaderRtt.textContent = 'OFF';
          cardHeaderRtt.className = 'text-red-tac font-bold';
          cardStatusDot.className = 'w-1.5 h-1.5 rounded-full bg-red-tac';
          offlineSubtext.textContent = window.I18n.t('offline_connect_hint');
          offlineOverlay.classList.remove('hidden');
          cameraCard.classList.add('grayscale', 'opacity-60');
          return;
        }

        if (!onlineCameras.some((c) => c.id === activeCameraId) || !activeCameraId || activeCameraId === 'undefined') {
          if (onlineCameras.length > 0) {
            activeCameraId = onlineCameras[0].id;
            localStorage.setItem('ndi_active_cam', activeCameraId);
          }
        }

        onlineCameras.forEach((cam, idx) => {
          const prof = ensureCameraProfile(cam, idx);
          camerasMap[cam.id] = { ...cam, displayName: prof.displayName };

          const btn = document.createElement('button');
          btn.setAttribute('data-cam-id', cam.id);
          btn.title = `${prof.displayName} · IP: ${cam.ip}`;
          const isSelected = cam.id === activeCameraId;

          if (isSelected) {
            btn.className = 'cam-tab px-1.5 py-0.5 rounded bg-cyan-tac text-surface-lowest font-bold text-[10px] flex items-center gap-1 shadow-[0_0_6px_rgba(0,240,255,0.4)] shrink-0';
            btn.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-surface-lowest animate-pulse"></span><span>${prof.displayName}</span>`;
          } else {
            btn.className = 'cam-tab px-1.5 py-0.5 rounded bg-surface-high text-txt-muted hover:text-txt-main font-bold text-[10px] flex items-center gap-1 shrink-0';
            btn.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-cyan-tac"></span><span>${prof.displayName}</span>`;
          }

          btn.addEventListener('click', () => selectCamera(cam.id));
          camTabsContainer.appendChild(btn);
        });

        offlineOverlay.classList.add('hidden');
        cameraCard.classList.remove('grayscale', 'opacity-60');
      }

      function selectCamera(camId) {
        if (!camId || camId === 'undefined') {
          if (onlineCameras.length > 0) {
            camId = onlineCameras[0].id;
          } else {
            return;
          }
        }
        activeCameraId = camId;
        localStorage.setItem('ndi_active_cam', camId);
        isMirrorBtnActive = localStorage.getItem(`ndi_mirror_std_${camId}`) === '1';
        updateMirrorPanUi();

        const cam = camerasMap[camId];
        if (cam) {
          cardHeaderIp.textContent = cam.ip;
          cardHeaderIp.title = `IP OBS: ${cam.ip}`;
        }
        applyCustomPresets(camId);
        renderDynamicCameraTabs();
        pollTelemetryOnce();
      }

      let lastTopologySig = null;

      async function handleCamerasListUpdate(list, forceRender = false) {
        const filtered = Array.isArray(list) ? list.filter((c) => c.is_online) : [];
        const sig = filtered.map((c) => `${c.id}:${c.ip}:${c.is_online}`).join('|');

        filtered.forEach((c) => {
          if (camerasMap[c.id]) {
            camerasMap[c.id].latency_ms = c.latency_ms;
            camerasMap[c.id].ip = c.ip;
          }
        });

        if (!forceRender && sig === lastTopologySig) {
          return;
        }
        lastTopologySig = sig;
        onlineCameras = filtered;
        renderDynamicCameraTabs();
        if (onlineCameras.length > 0 && activeCameraId) {
          selectCamera(activeCameraId);
        }
      }

      btnOfflineScan.addEventListener('click', async () => {
        offlineSubtext.textContent = window.I18n.t('offline_scanning_subnet');
        const list = await window.NDIPtz.scanAllCameras().catch(() => []);
        handleCamerasListUpdate(list, true);
      });

      const btnPinMain = document.getElementById('btn-pin-main');
      btnPinMain.addEventListener('click', async () => {
        isPinned = await window.NDIPtz.toggleWindowPin();
        if (isPinned) {
          btnPinMain.className = 'w-5 h-5 rounded bg-cyan-tac text-surface-lowest flex items-center justify-center shadow-[0_0_8px_#00f0ff]';
        } else {
          btnPinMain.className = 'w-5 h-5 rounded bg-surface-high hover:bg-surface-highest flex items-center justify-center text-txt-muted hover:text-txt-main transition-colors';
        }
      });

      // Telemetría cinemática local
      async function pollTelemetryOnce() {
        if (!activeCameraId || onlineCameras.length === 0) return;
        try {
          const tel = await window.NDIPtz.getTelemetry(activeCameraId);
          if (!tel) return;
          const cam = camerasMap[activeCameraId];
          if (cam) {
            cardHeaderIp.textContent = cam.ip;
          }

          if (tel.is_online) {
            offlineOverlay.classList.add('hidden');
            cameraCard.classList.remove('grayscale', 'opacity-60');
            cardStatusDot.className = 'w-1.5 h-1.5 rounded-full bg-cyan-tac shadow-[0_0_5px_#00f0ff]';
            cardHeaderRtt.textContent = `${tel.latency_ms}ms`;
            cardHeaderRtt.className = 'text-cyan-tac font-bold';

            const signPan = tel.pan_deg >= 0 ? '+' : '';
            const signTilt = tel.tilt_deg >= 0 ? '+' : '';
            oledPan.textContent = `${signPan}${tel.pan_deg.toFixed(1)}°`;
            oledTilt.textContent = `${signTilt}${tel.tilt_deg.toFixed(1)}°`;
            oledZoom.textContent = `${tel.zoom_ratio.toFixed(1)}x`;
          }
        } catch (err) {}
      }

      // Escucha de cambio de idioma en vivo para actualizar textos generados por JS
      window.I18n.onLanguageChange(() => {
        renderDynamicCameraTabs();
        applyCustomPresets(activeCameraId);
        if (oledPresetBadge.textContent === 'CENTRO' || oledPresetBadge.textContent === 'CENTER') {
          oledPresetBadge.textContent = window.I18n.t('badge_center');
        } else if (oledPresetBadge.textContent === 'MANUAL') {
          oledPresetBadge.textContent = window.I18n.t('badge_manual');
        }
      });

      window.NDIPtz.onCamerasUpdated((list) => {
        handleCamerasListUpdate(list);
      });

      setInterval(async () => {
        try {
          const list = await window.NDIPtz.getCameras();
          handleCamerasListUpdate(list);
        } catch (e) {}
      }, 1500);

      window.NDIPtz.getCameras().then((list) => {
        if (list && list.length > 0) {
          handleCamerasListUpdate(list, true);
        } else {
          window.NDIPtz.scanAllCameras().then((scanned) => handleCamerasListUpdate(scanned, true)).catch(() => {});
        }
      });

      setInterval(pollTelemetryOnce, 250);
    });
  </script>
</body>
</html>
