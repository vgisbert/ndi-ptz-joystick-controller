<!DOCTYPE html>
<html class="dark" lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="app_title_floating">NDI PTZ Controller — Ventana Flotante</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@100..900&family=JetBrains+Mono:wght@100..900&family=Space+Grotesk:wght@100..900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface-dim": "#111319",
            "surface-container-lowest": "#0b0e13",
            "surface-container-low": "#191c21",
            "surface-container": "#1d2025",
            "surface-container-high": "#272a30",
            "surface-container-highest": "#32353a",
            "primary-container": "#00f0ff",
            "on-primary-container": "#006970",
            "secondary-container": "#feb300",
            "on-secondary-container": "#6a4800",
            "error-container": "#93000a",
            "primary": "#dbfcff",
            "secondary": "#ffd799",
            "outline": "#849495",
            "outline-variant": "#3b494b",
            "on-surface": "#e1e2e9",
            "on-surface-variant": "#b9cacb"
          },
          fontFamily: {
            "headline-sm": ["Space Grotesk"],
            "label-lg": ["JetBrains Mono"],
            "label-md": ["JetBrains Mono"],
            "label-sm": ["JetBrains Mono"],
            "telemetry": ["JetBrains Mono"]
          }
        }
      }
    };
  </script>
  <style>
    body { user-select: none; -webkit-user-select: none; margin: 0; padding: 0; background: #0b0e13; overflow-x: hidden; }
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="bg-surface-dim font-sans text-on-surface antialiased min-h-screen flex flex-col justify-between">

  <!-- ================= BARRA DE TÍTULO TÁCTICA ACRÍLICA ================= -->
  <header class="flex items-center justify-between px-3 py-2 bg-surface-container-highest border-b border-outline-variant/40 shadow-sm" data-tauri-drag-region>
    <div class="flex items-center gap-2 pointer-events-none">
      <span class="w-2.5 h-2.5 rounded-full bg-primary-container shadow-[0_0_8px_rgba(0,240,255,1)] animate-pulse"></span>
      <span id="win-cam-name" class="font-headline-sm text-[12px] text-primary tracking-wider uppercase font-bold">CAM-01 Nuroum V403</span>
      <span id="win-cam-ip" class="px-1.5 py-0.5 rounded bg-surface-container-lowest text-outline font-label-sm text-[10px] tracking-wider font-mono">192.168.1.101</span>
    </div>
    
    <div class="flex items-center gap-1">
      <div id="win-rtt" class="font-label-sm text-[10px] text-primary font-bold mr-1">2ms</div>
      
      <!-- Botón de Idioma (SP / EN) -->
      <button id="btn-lang" class="px-1.5 py-0.5 rounded bg-surface-container-high hover:bg-surface-container text-primary-container font-label-sm text-[10px] font-bold border border-outline-variant/40 transition-all cursor-pointer mr-1" data-i18n-title="btn_lang_title" title="Cambiar idioma">
        SP
      </button>

      <!-- Botón de Fijado Always-on-Top (PIN) -->
      <button id="btn-pin" class="w-6 h-6 rounded flex items-center justify-center text-outline hover:text-on-surface hover:bg-surface-container-high transition-all" data-i18n-title="btn_pin_floating_title" title="Fijar Ventana Flotante (Always on Top)">
        <span class="material-symbols-outlined text-[15px]">push_pin</span>
      </button>

      <!-- Botón Minimizar -->
      <button id="btn-minimize" class="w-6 h-6 rounded flex items-center justify-center text-outline hover:text-on-surface hover:bg-surface-container-high transition-all" data-i18n-title="btn_minimize_title" title="Minimizar">
        <span class="material-symbols-outlined text-[15px]">remove</span>
      </button>

      <!-- Botón Cerrar -->
      <button id="btn-close" class="w-6 h-6 rounded flex items-center justify-center text-outline hover:bg-error-container hover:text-white transition-all" data-i18n-title="btn_close_title" title="Cerrar Ventana">
        <span class="material-symbols-outlined text-[15px]">close</span>
      </button>
    </div>
  </header>

  <!-- ================= CHÁSIS INTERNO ================= -->
  <main class="flex-1 p-3 flex flex-col gap-3">

    <!-- OLED Display de Telemetría -->
    <section class="p-2.5 rounded-lg bg-surface-container-lowest border border-outline-variant/30 shadow-[inset_0_2px_8px_rgba(0,0,0,0.9)] relative overflow-hidden">
      <div class="pointer-events-none absolute inset-0 bg-gradient-to-tr from-transparent via-primary-container/5 to-transparent"></div>
      
      <div class="flex items-center justify-between pb-2 border-b border-outline-variant/20">
        <div class="flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-primary-container shadow-[0_0_6px_rgba(0,240,255,0.8)]"></span>
          <span class="font-label-sm text-[10px] text-primary uppercase font-bold tracking-wider" data-i18n="badge_visca_active">VISCA UDP 1259 // ACTIVO</span>
        </div>
        <span id="disp-preset-active" class="px-1.5 py-0.5 rounded bg-secondary-container/20 text-secondary font-label-sm text-[9px] uppercase font-bold tracking-wider" data-i18n="badge_free_preset">PRESET LIBRE</span>
      </div>

      <div class="grid grid-cols-4 gap-1.5 pt-2 text-center">
        <div class="bg-surface-container-low/80 p-1.5 rounded">
          <div class="font-label-sm text-[8px] text-outline uppercase" data-i18n="telem_pan">PANORÁMICA</div>
          <div id="disp-pan" class="font-telemetry text-[13px] text-primary font-bold">0.00°</div>
        </div>
        <div class="bg-surface-container-low/80 p-1.5 rounded">
          <div class="font-label-sm text-[8px] text-outline uppercase" data-i18n="telem_tilt">INCLINACIÓN</div>
          <div id="disp-tilt" class="font-telemetry text-[13px] text-primary font-bold">0.00°</div>
        </div>
        <div class="bg-surface-container-low/80 p-1.5 rounded">
          <div class="font-label-sm text-[8px] text-outline uppercase" data-i18n="telem_zoom">ZOOM</div>
          <div id="disp-zoom" class="font-telemetry text-[13px] text-secondary font-bold">1.00x</div>
        </div>
        <div class="bg-surface-container-low/80 p-1.5 rounded">
          <div class="font-label-sm text-[8px] text-outline uppercase" data-i18n="telem_focus">ENFOQUE</div>
          <div id="disp-focus" class="font-telemetry text-[13px] text-on-surface font-bold">AUTO</div>
        </div>
      </div>
    </section>

    <!-- Cardán / Joystick Táctico Virtual -->
    <section class="flex flex-col items-center justify-center p-3 rounded-xl bg-surface-container border border-outline-variant/30 shadow-[inset_0_2px_12px_rgba(0,0,0,0.6)] relative">
      <div class="w-full flex items-center justify-between font-label-sm text-[10px] text-outline uppercase tracking-wider mb-2">
        <span data-i18n="radar_vector">Radar Vectorial</span>
        <div class="flex items-center gap-1.5">
          <button id="btn-creep" class="px-1.5 py-0.5 rounded bg-surface-container-lowest text-outline hover:text-primary border border-outline-variant/40 font-bold transition-all" data-i18n-title="btn_creep_title" data-i18n="btn_creep" title="Modo Creep 25% para paneo lento cinematográfico">
            CREEP 25%
          </button>
          <button id="btn-home" class="px-1.5 py-0.5 rounded bg-surface-container-lowest text-outline hover:text-primary border border-outline-variant/40 font-bold transition-all" data-i18n-title="btn_home_floating_title" title="Centrar cámara (ESPACIO)">
            HOME
          </button>
        </div>
      </div>

      <!-- Zona del Cardán Físico -->
      <div id="joystick-zone" class="relative w-56 h-56 rounded-full bg-surface-container-lowest flex items-center justify-center shadow-[inset_0_6px_16px_rgba(0,0,0,0.9),0_4px_12px_rgba(255,255,255,0.03)] touch-none cursor-crosshair">
        <!-- Guías circulares de velocidad (25%, 50%, 75%, 100%) -->
        <svg class="absolute inset-0 w-full h-full pointer-events-none text-outline-variant/40" viewBox="0 0 200 200">
          <circle cx="100" cy="100" r="90" stroke="currentColor" stroke-dasharray="2 3" stroke-width="1"></circle>
          <circle cx="100" cy="100" r="67" stroke="currentColor" stroke-dasharray="3 3" stroke-width="1"></circle>
          <circle cx="100" cy="100" r="45" stroke="currentColor" stroke-width="1"></circle>
          <circle cx="100" cy="100" r="22" stroke="currentColor" stroke-dasharray="2 2" stroke-width="1"></circle>
          <line x1="100" y1="10" x2="100" y2="190" stroke="currentColor" stroke-width="1" stroke-dasharray="1 3"></line>
          <line x1="10" y1="100" x2="190" y2="100" stroke="currentColor" stroke-width="1" stroke-dasharray="1 3"></line>
        </svg>

        <!-- Puntero / Palanca Central del Joystick -->
        <div id="joystick-puck" class="absolute w-12 h-12 rounded-full bg-gradient-to-br from-surface-container-high to-surface-container-lowest border-2 border-primary-container shadow-[0_0_15px_rgba(0,240,255,0.6)] flex items-center justify-center pointer-events-none transition-transform duration-75">
          <span class="w-3 h-3 rounded-full bg-primary-container shadow-[0_0_6px_rgba(0,240,255,1)]"></span>
        </div>
      </div>

      <!-- Controles de Zoom Tele / Wide -->
      <div class="w-full grid grid-cols-2 gap-2 mt-3">
        <button id="btn-zoom-wide" class="py-1.5 rounded bg-surface-container-high hover:bg-surface-container-highest text-on-surface font-label-sm text-[11px] font-bold flex items-center justify-center gap-1 border border-outline-variant/30 active:scale-95 transition-all" data-i18n-title="btn_zoom_out_title" title="Alejar imagen">
          <span class="material-symbols-outlined text-[14px] text-secondary">zoom_out</span>
          <span data-i18n="btn_zoom_wide">ZOOM WIDE</span>
        </button>
        <button id="btn-zoom-tele" class="py-1.5 rounded bg-surface-container-high hover:bg-surface-container-highest text-on-surface font-label-sm text-[11px] font-bold flex items-center justify-center gap-1 border border-outline-variant/30 active:scale-95 transition-all" data-i18n-title="btn_zoom_in_title" title="Acercar imagen">
          <span class="material-symbols-outlined text-[14px] text-primary">zoom_in</span>
          <span data-i18n="btn_zoom_tele">ZOOM TELE</span>
        </button>
      </div>
    </section>

    <!-- Bancada de Presets Rápidos (GOTO 01 - 08) -->
    <section class="flex flex-col gap-1.5 bg-surface-container p-2.5 rounded-xl border border-outline-variant/30">
      <div class="flex items-center justify-between">
        <span class="font-label-sm text-[10px] text-secondary uppercase font-bold tracking-wider" data-i18n="presets_goto_floating">Ir a Preset (GOTO)</span>
        <span class="font-label-sm text-[9px] text-outline" data-i18n="mem_nvram_help">Guardar: Mantener 2s</span>
      </div>

      <div id="floating-presets-grid" class="grid grid-cols-4 gap-1.5">
        <button data-goto="1" class="btn-goto p-1.5 rounded bg-surface-container-high hover:bg-secondary-container hover:text-on-secondary-container text-on-surface font-label-sm text-[11px] font-bold flex flex-col items-center border border-outline-variant/20 transition-all active:scale-95">
          <span class="text-[8px] opacity-70">P1</span>
          <span class="preset-name">ESCENARIO</span>
        </button>
        <button data-goto="2" class="btn-goto p-1.5 rounded bg-surface-container-high hover:bg-secondary-container hover:text-on-secondary-container text-on-surface font-label-sm text-[11px] font-bold flex flex-col items-center border border-outline-variant/20 transition-all active:scale-95">
          <span class="text-[8px] opacity-70">P2</span>
          <span class="preset-name">TECLADO</span>
        </button>
        <button data-goto="3" class="btn-goto p-1.5 rounded bg-surface-container-high hover:bg-secondary-container hover:text-on-secondary-container text-on-surface font-label-sm text-[11px] font-bold flex flex-col items-center border border-outline-variant/20 transition-all active:scale-95">
          <span class="text-[8px] opacity-70">P3</span>
          <span class="preset-name">BATERÍA</span>
        </button>
        <button data-goto="4" class="btn-goto p-1.5 rounded bg-surface-container-high hover:bg-secondary-container hover:text-on-secondary-container text-on-surface font-label-sm text-[11px] font-bold flex flex-col items-center border border-outline-variant/20 transition-all active:scale-95">
          <span class="text-[8px] opacity-70">P4</span>
          <span class="preset-name">VOZ PPAL</span>
        </button>
        <button data-goto="5" class="btn-goto p-1.5 rounded bg-surface-container-high hover:bg-secondary-container hover:text-on-secondary-container text-on-surface font-label-sm text-[11px] font-bold flex flex-col items-center border border-outline-variant/20 transition-all active:scale-95">
          <span class="text-[8px] opacity-70">P5</span>
          <span class="preset-name">BAJO</span>
        </button>
        <button data-goto="6" class="btn-goto p-1.5 rounded bg-surface-container-high hover:bg-secondary-container hover:text-on-secondary-container text-on-surface font-label-sm text-[11px] font-bold flex flex-col items-center border border-outline-variant/20 transition-all active:scale-95">
          <span class="text-[8px] opacity-70">P6</span>
          <span class="preset-name">GUITARRA</span>
        </button>
        <button data-goto="7" class="btn-goto p-1.5 rounded bg-surface-container-high hover:bg-secondary-container hover:text-on-secondary-container text-on-surface font-label-sm text-[11px] font-bold flex flex-col items-center border border-outline-variant/20 transition-all active:scale-95">
          <span class="text-[8px] opacity-70">P7</span>
          <span class="preset-name">PÚBLICO</span>
        </button>
        <button data-goto="8" class="btn-goto p-1.5 rounded bg-surface-container-high hover:bg-secondary-container hover:text-on-secondary-container text-on-surface font-label-sm text-[11px] font-bold flex flex-col items-center border border-outline-variant/20 transition-all active:scale-95">
          <span class="text-[8px] opacity-70">P8</span>
          <span class="preset-name">TELÓN</span>
        </button>
      </div>
    </section>

  </main>

  <script src="i18n.js"></script>
  <script src="ndi_ptz_client.js"></script>
  <script>
    // Obtener parámetros de cámara desde la URL
    const urlParams = new URLSearchParams(window.location.search);
    const cameraId = urlParams.get('cam') || 'cam-192-168-9-171';

    // Estado del controlador flotante
    let isCreep = false;
    let isDragging = false;
    let activePreset = null;
    let isPinned = false;

    // Elementos DOM
    const btnPin = document.getElementById('btn-pin');
    const btnMinimize = document.getElementById('btn-minimize');
    const btnClose = document.getElementById('btn-close');
    const btnCreep = document.getElementById('btn-creep');
    const btnHome = document.getElementById('btn-home');
    const joystickZone = document.getElementById('joystick-zone');
    const joystickPuck = document.getElementById('joystick-puck');
    const dispPan = document.getElementById('disp-pan');
    const dispTilt = document.getElementById('disp-tilt');
    const dispZoom = document.getElementById('disp-zoom');
    const dispPresetActive = document.getElementById('disp-preset-active');

    function applyPresetsLabels() {
      try {
        const raw = localStorage.getItem('ndi_cam_profiles') || localStorage.getItem('ndi_cam_profiles_mac');
        const profiles = raw ? JSON.parse(raw) : {};
        const p = profiles[cameraId];
        const defaultList = window.I18n.getDefaultPresets(true);
        const presets = (p && Array.isArray(p.presets)) ? p.presets : defaultList;

        document.querySelectorAll('#floating-presets-grid .btn-goto').forEach((btn, idx) => {
          const nameSpan = btn.querySelector('.preset-name');
          if (nameSpan) {
            nameSpan.textContent = presets[idx] || defaultList[idx] || `P${idx + 1}`;
          }
        });
      } catch (e) {}
    }

    // Inicializar estado de fijado (PIN)
    async function initPinState() {
      try {
        isPinned = await window.NDIPtz.isWindowPinned();
        updatePinUi();
      } catch (e) {}
    }

    function updatePinUi() {
      if (isPinned) {
        btnPin.classList.add('text-primary-container', 'shadow-[0_0_8px_rgba(0,240,255,0.7)]');
        btnPin.classList.remove('text-outline');
      } else {
        btnPin.classList.remove('text-primary-container', 'shadow-[0_0_8px_rgba(0,240,255,0.7)]');
        btnPin.classList.add('text-outline');
      }
    }

    btnPin.addEventListener('click', async () => {
      isPinned = await window.NDIPtz.toggleWindowPin();
      updatePinUi();
    });

    btnMinimize.addEventListener('click', () => {
      window.NDIPtz.minimizeWindow();
    });

    btnClose.addEventListener('click', () => {
      window.NDIPtz.closeWindow();
    });

    // Modo Creep 25%
    btnCreep.addEventListener('click', () => {
      isCreep = !isCreep;
      if (isCreep) {
        btnCreep.classList.add('bg-primary-container', 'text-on-primary-container', 'shadow-[0_0_8px_rgba(0,240,255,0.5)]');
        btnCreep.classList.remove('bg-surface-container-lowest', 'text-outline');
      } else {
        btnCreep.classList.remove('bg-primary-container', 'text-on-primary-container', 'shadow-[0_0_8px_rgba(0,240,255,0.5)]');
        btnCreep.classList.add('bg-surface-container-lowest', 'text-outline');
      }
    });

    // Home / Centrado
    btnHome.addEventListener('click', async () => {
      resetPuck();
      await window.NDIPtz.home(cameraId);
    });

    // Control del Joystick Virtual
    const zoneRect = () => joystickZone.getBoundingClientRect();
    const maxRadius = 75;

    function handleJoystickMove(clientX, clientY) {
      const rect = zoneRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;

      let dx = clientX - centerX;
      let dy = clientY - centerY;

      const distance = Math.sqrt(dx * dx + dy * dy);
      if (distance > maxRadius) {
        dx = (dx / distance) * maxRadius;
        dy = (dy / distance) * maxRadius;
      }

      joystickPuck.style.transform = `translate(${dx}px, ${dy}px)`;

      const normX = dx / maxRadius;
      const normY = -(dy / maxRadius);

      const scale = isCreep ? 0.25 : 1.0;
      window.NDIPtz.sendVector(cameraId, normX, normY, scale);
    }

    function resetPuck() {
      joystickPuck.style.transform = 'translate(0px, 0px)';
      window.NDIPtz.stop(cameraId);
    }

    joystickZone.addEventListener('pointerdown', (e) => {
      isDragging = true;
      joystickZone.setPointerCapture(e.pointerId);
      handleJoystickMove(e.clientX, e.clientY);
    });

    joystickZone.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      handleJoystickMove(e.clientX, e.clientY);
    });

    const stopDrag = (e) => {
      if (!isDragging) return;
      isDragging = false;
      resetPuck();
    };

    joystickZone.addEventListener('pointerup', stopDrag);
    joystickZone.addEventListener('pointercancel', stopDrag);

    // Tecla ESPACIO para parada y centrado instantáneo
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        resetPuck();
      }
    });

    // Botones Zoom Tele / Wide
    const btnZoomTele = document.getElementById('btn-zoom-tele');
    const btnZoomWide = document.getElementById('btn-zoom-wide');

    btnZoomTele.addEventListener('pointerdown', () => window.NDIPtz.zoom(cameraId, 'tele', 4));
    btnZoomTele.addEventListener('pointerup', () => window.NDIPtz.zoom(cameraId, 'stop'));
    btnZoomTele.addEventListener('pointercancel', () => window.NDIPtz.zoom(cameraId, 'stop'));

    btnZoomWide.addEventListener('pointerdown', () => window.NDIPtz.zoom(cameraId, 'wide', 4));
    btnZoomWide.addEventListener('pointerup', () => window.NDIPtz.zoom(cameraId, 'stop'));
    btnZoomWide.addEventListener('pointercancel', () => window.NDIPtz.zoom(cameraId, 'stop'));

    // Presets GOTO: Pulsación normal = IR A PRESET | Mantener 2 segundos = MEMORIZAR
    document.querySelectorAll('.btn-goto').forEach(btn => {
      let holdTimer = null;
      let visualTimer = null;
      let isLongPress = false;
      const num = parseInt(btn.getAttribute('data-goto'), 10);

      const cancelHold = () => {
        if (visualTimer) { clearTimeout(visualTimer); visualTimer = null; }
        if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
        btn.classList.remove('bg-error-container', 'text-white', 'animate-pulse');
      };

      btn.addEventListener('pointerdown', (e) => {
        if (e.button !== 0) return;
        isLongPress = false;

        visualTimer = setTimeout(() => {
          btn.classList.add('bg-error-container', 'text-white', 'animate-pulse');
        }, 180);

        holdTimer = setTimeout(async () => {
          holdTimer = null;
          isLongPress = true;
          if (visualTimer) clearTimeout(visualTimer);

          await window.NDIPtz.preset(cameraId, 'store', num);
          btn.classList.remove('animate-pulse', 'bg-error-container');
          btn.classList.add('bg-primary-container', 'text-on-primary-container');
          dispPresetActive.textContent = window.I18n.t('mem_saved_badge', { n: num });

          setTimeout(() => {
            btn.classList.remove('bg-primary-container', 'text-on-primary-container');
          }, 1500);
        }, 2000);
      });

      btn.addEventListener('pointerup', async () => {
        if (visualTimer) { clearTimeout(visualTimer); visualTimer = null; }
        if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
        if (!isLongPress) {
          dispPresetActive.textContent = `PRESET #${num.toString().padStart(2, '0')}`;
          await window.NDIPtz.preset(cameraId, 'recall', num);
        }
      });

      btn.addEventListener('pointerleave', cancelHold);
      btn.addEventListener('pointercancel', cancelHold);

      btn.addEventListener('click', (e) => {
        if (isLongPress) {
          e.preventDefault();
          e.stopPropagation();
          isLongPress = false;
        }
      });
    });

    // Reaccionar a cambios de idioma
    window.I18n.onLanguageChange(() => {
      applyPresetsLabels();
      if (dispPresetActive.textContent === 'PRESET LIBRE' || dispPresetActive.textContent === 'FREE PRESET') {
        dispPresetActive.textContent = window.I18n.t('badge_free_preset');
      }
    });

    // Bucle de telemetría a 10 Hz
    setInterval(async () => {
      try {
        const tel = await window.NDIPtz.getTelemetry(cameraId);
        if (tel) {
          dispPan.textContent = `${tel.pan_deg > 0 ? '+' : ''}${tel.pan_deg.toFixed(2)}°`;
          dispTilt.textContent = `${tel.tilt_deg > 0 ? '+' : ''}${tel.tilt_deg.toFixed(2)}°`;
          dispZoom.textContent = `${tel.zoom_ratio.toFixed(2)}x`;
          document.getElementById('win-rtt').textContent = `${tel.latency_ms}ms`;
        }
      } catch (e) {}
    }, 100);

    initPinState();
    applyPresetsLabels();
  </script>
</body>
</html>
